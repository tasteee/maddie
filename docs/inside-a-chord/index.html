<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A playable walkthrough of chords, voicings, and performance patterns in Maddie.">
  <title>Inside a Chord · Maddie</title>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="wordmark"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span> Maddie <span class="series">/ Inside a Chord</span></div>
      <nav id="chapters" aria-label="Walkthrough chapters"></nav>
    </header>
    <main>
      <div class="composition">
        <div class="intro" id="intro"></div>
        <section class="instrument" aria-labelledby="instrument-title">
          <div class="instrument-top">
            <div class="instrument-caption"><span class="instrument-icon" aria-hidden="true">▥</span><h2 id="instrument-title">Piano roll</h2><span class="context" id="context"></span></div>
            <div class="instrument-actions">
              <button class="button quiet data-toggle" id="data-toggle" type="button" aria-haspopup="dialog" aria-controls="drawer">View data</button>
              <button class="button play" id="play" type="button"><span aria-hidden="true">▶</span> Play</button>
            </div>
          </div>
          <div class="roll-layout">
            <div class="pitch-labels" id="pitch-labels" aria-hidden="true"></div>
            <div class="roll" id="roll" role="group" aria-label="Piano roll. Higher rows are higher pitches. Time runs left to right.">
              <div class="grid" id="grid" aria-hidden="true"></div>
              <div class="pitches" id="pitches"></div>
              <div class="playhead" id="playhead" aria-hidden="true"></div>
            </div>
          </div>
          <div class="roll-footer"><div class="legend" id="legend"></div><span class="context">4 beats</span></div>
          <section id="observation" class="observation" aria-label="What this example shows" aria-live="polite" aria-atomic="true"></section>
        </section>
      </div>
      <div class="scene-wrap"><div id="scene" class="scene"></div></div>
      <dialog class="data-dialog" id="drawer" aria-labelledby="data-title">
        <header class="data-heading">
          <h2 id="data-title">Behind this example</h2>
          <form method="dialog"><button class="button" type="submit" autofocus>Close</button></form>
        </header>
        <div id="data"></div>
      </dialog>
      <p class="error" id="error" role="alert"></p>
      <noscript>This walkthrough requires JavaScript for the piano roll and playback.</noscript>
    </main>
    <footer class="navigation"><button class="button quiet" id="back" type="button">Back</button><span id="progress" class="progress"></span><button class="button primary" id="next" type="button">Continue</button></footer>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
