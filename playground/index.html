<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maddie</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 22 22%27 fill=%27%23111114%27%3E%3Crect x=%272%27 y=%274%27 width=%278%27 height=%274%27 rx=%271.5%27/%3E%3Crect x=%277%27 y=%2710%27 width=%2711%27 height=%274%27 rx=%271.5%27 opacity=%27.7%27/%3E%3Crect x=%274%27 y=%2716%27 width=%276%27 height=%274%27 rx=%271.5%27 opacity=%27.45%27/%3E%3C/svg%3E" />
    <script>
      // Set Zest's theme before first paint, the way z-theme-switcher stores it.
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem('zest-theme-preference');
        } catch {}
        const system = !stored || stored === 'system';
        const theme = system ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : stored;
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <maddie-editor global-shortcuts grid="1/16" scale="C minor" tempo="124" fold="scale">
      <z-theme-switcher slot="toolbar-end" kind="icon" size="sm"></z-theme-switcher>
    </maddie-editor>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
